<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Oceanic Navy -->
    <radialGradient id="brentBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0F243A"/>
      <stop offset="60%" stop-color="#081422"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <!-- Outer Rim Gradient -->
    <linearGradient id="brentRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Flare Glow -->
    <radialGradient id="flareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <filter id="brentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#brentBg)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#brentRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="0.75"/>

  <!-- Offshore Oil Rig / Derrick Motif -->
  <g filter="url(#brentShadow)">
    <!-- Sea Waves at Bottom -->
    <path d="M 16 43 Q 22 41 28 43 T 40 43 T 48 43 L 48 48 L 16 48 Z" fill="#0C2033" opacity="0.9"/>
    <path d="M 14 45 Q 20 43.5 26 45 T 38 45 T 50 45 L 50 49 L 14 49 Z" fill="#06121E"/>

    <!-- Derrick Truss Structure -->
    <!-- Platform Base Legs -->
    <line x1="20" y1="44" x2="26" y2="30" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="44" y1="44" x2="38" y2="30" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Central Tower -->
    <line x1="26" y1="30" x2="30" y2="17" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="38" y1="30" x2="34" y2="17" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Top Crown -->
    <rect x="29.5" y="15" width="5" height="2.5" rx="0.5" fill="#E2E8F0"/>

    <!-- Cross Bracing (X-braces) -->
    <line x1="21" y1="41" x2="43" y2="33" stroke="#64748B" stroke-width="0.8"/>
    <line x1="43" y1="41" x2="21" y2="33" stroke="#64748B" stroke-width="0.8"/>
    <line x1="23" y1="33" x2="41" y2="33" stroke="#CBD5E1" stroke-width="1"/>
    
    <line x1="27" y1="28" x2="37" y2="21" stroke="#64748B" stroke-width="0.7"/>
    <line x1="37" y1="28" x2="27" y2="21" stroke="#64748B" stroke-width="0.7"/>
    <line x1="28" y1="22" x2="36" y2="22" stroke="#94A3B8" stroke-width="0.8"/>

    <!-- Flare Boom on Side -->
    <line x1="36" y1="26" x2="47" y2="15" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="37" y1="30" x2="45" y2="18" stroke="#64748B" stroke-width="0.7"/>
    
    <!-- Flare Flame at Boom Tip -->
    <circle cx="48" cy="14" r="5" fill="url(#flareGlow)"/>
    <path d="M 47 16 Q 50 13 49 10 Q 46 12 47 16 Z" fill="#FEF08A"/>

    <!-- Platform Deck Block -->
    <rect x="23" y="32" width="18" height="2.5" rx="0.6" fill="#F8FAFC"/>
  </g>

  <!-- Bottom Label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="900" fill="#38BDF8" letter-spacing="1.5">BRENT</text>
</svg>
