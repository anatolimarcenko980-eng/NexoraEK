<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Midnight Slate -->
    <radialGradient id="platBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E2333"/>
      <stop offset="65%" stop-color="#0E121E"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <!-- Outer Rim Gradient: Brilliant Chrome Platinum -->
    <linearGradient id="platRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#C7D2FE"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Ingot Top Facet: Mirror Finish with subtle icy violet tint -->
    <linearGradient id="platTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Ingot Front Facet -->
    <linearGradient id="platFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Ingot Right Facet -->
    <linearGradient id="platRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- Diamond Specular Flare -->
    <radialGradient id="platGlint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#E0E7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="platShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#platBg)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#platRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#A5B4FC" stroke-opacity="0.3" stroke-width="0.75"/>

  <!-- Ingot 3D Group with Shadow -->
  <g filter="url(#platShadow)">
    <!-- Top Face -->
    <polygon points="17,25 43,21 47,26 21,31" fill="url(#platTop)"/>
    <!-- Front Face -->
    <polygon points="21,31 47,26 43,43 17,47" fill="url(#platFront)"/>
    <!-- Right Face -->
    <polygon points="47,26 51,28 47,45 43,43" fill="url(#platRight)"/>
    <!-- Highlights & Bevel Ridges -->
    <polyline points="17,25 21,31 47,26" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.95"/>
    <line x1="21" y1="31" x2="17" y2="47" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7"/>

    <!-- Hallmark Stamp on Front Face -->
    <g transform="translate(30, 36) rotate(-7) scale(0.85)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#0F172A" opacity="0.9" letter-spacing="0.5">Pt 999.5</text>
      <text x="0" y="5.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="4.2" font-weight="800" fill="#1E293B" letter-spacing="1">PLATINUM</text>
    </g>

    <!-- Chemical Hallmark Circle Stamp on Top Face -->
    <ellipse cx="32" cy="26" rx="4" ry="1.8" fill="none" stroke="#475569" stroke-width="0.4" opacity="0.7"/>
    <text x="32" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" fill="#1E293B" opacity="0.9">Pt 78</text>
  </g>

  <!-- Top Ingot Corner Sparkle/Flare -->
  <path d="M 21 31 L 21 27 L 22 31 L 26 31 L 22 32 L 24 36 L 21 33 L 18 36 L 20 32 L 16 31 L 20 31 Z" fill="url(#platGlint)"/>
  <circle cx="21" cy="31" r="2.8" fill="url(#platGlint)"/>

  <!-- Subtle bottom label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.2" font-weight="900" fill="#E2E8F0" letter-spacing="1.5">PLATINUM</text>
</svg>
