<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="copperBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D1208"/>
      <stop offset="65%" stop-color="#190703"/>
      <stop offset="100%" stop-color="#080201"/>
    </radialGradient>
    <!-- Outer Rim Gradient -->
    <linearGradient id="copperRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="75%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <!-- Copper Ingot Top Facet -->
    <linearGradient id="copperTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="75%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <!-- Copper Ingot Front Facet -->
    <linearGradient id="copperFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#C2410C"/>
      <stop offset="80%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#691F06"/>
    </linearGradient>
    <!-- Copper Ingot Right Facet -->
    <linearGradient id="copperRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <!-- Copper Sparkle -->
    <radialGradient id="copperGlint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FFEDD5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <filter id="copperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#copperBg)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#copperRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#EA580C" stroke-opacity="0.25" stroke-width="0.75"/>

  <!-- Ingot 3D Group with Shadow -->
  <g filter="url(#copperShadow)">
    <!-- Top Face -->
    <polygon points="17,25 43,21 47,26 21,31" fill="url(#copperTop)"/>
    <!-- Front Face -->
    <polygon points="21,31 47,26 43,43 17,47" fill="url(#copperFront)"/>
    <!-- Right Face -->
    <polygon points="47,26 51,28 47,45 43,43" fill="url(#copperRight)"/>
    <!-- Highlights & Bevel Ridges -->
    <polyline points="17,25 21,31 47,26" fill="none" stroke="#FFF7ED" stroke-width="0.75" opacity="0.85"/>
    <line x1="21" y1="31" x2="17" y2="47" stroke="#FFEDD5" stroke-width="0.5" opacity="0.6"/>

    <!-- Hallmark Stamp on Front Face -->
    <g transform="translate(30, 36) rotate(-7) scale(0.85)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#431407" opacity="0.9" letter-spacing="0.5">Cu 29</text>
      <text x="0" y="5.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="4.5" font-weight="800" fill="#7C2D12" letter-spacing="1">99.99% PURE</text>
    </g>

    <!-- Chemical Hallmark Circle Stamp on Top Face -->
    <ellipse cx="32" cy="26" rx="4" ry="1.8" fill="none" stroke="#9A3412" stroke-width="0.4" opacity="0.7"/>
    <text x="32" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" fill="#7C2D12" opacity="0.9">Cu</text>
  </g>

  <!-- Top Ingot Corner Sparkle/Flare -->
  <path d="M 21 31 L 21 28 L 22 31 L 25 31 L 22 32 L 23 35 L 21 33 L 19 35 L 20 32 L 17 31 L 20 31 Z" fill="url(#copperGlint)"/>
  <circle cx="21" cy="31" r="2.5" fill="url(#copperGlint)"/>

  <!-- Subtle bottom label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="900" fill="#FB923C" letter-spacing="1.5">COPPER</text>
</svg>
