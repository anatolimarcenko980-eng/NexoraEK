<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="silverBgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E232B"/>
      <stop offset="70%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <!-- Outer Rim Gradient -->
    <linearGradient id="silverRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Ingot Top Facet -->
    <linearGradient id="silverIngotTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Ingot Front Facet -->
    <linearGradient id="silverIngotFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Ingot Right Facet -->
    <linearGradient id="silverIngotRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- Specular Flare -->
    <radialGradient id="silverGlint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="silverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#silverBgGrad)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#silverRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="0.75"/>

  <!-- Ingot 3D Group with Shadow -->
  <g filter="url(#silverShadow)">
    <!-- Top Face -->
    <polygon points="17,25 43,21 47,26 21,31" fill="url(#silverIngotTop)"/>
    <!-- Front Face -->
    <polygon points="21,31 47,26 43,43 17,47" fill="url(#silverIngotFront)"/>
    <!-- Right Face -->
    <polygon points="47,26 51,28 47,45 43,43" fill="url(#silverIngotRight)"/>
    <!-- Highlights & Bevel Ridges -->
    <polyline points="17,25 21,31 47,26" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.9"/>
    <line x1="21" y1="31" x2="17" y2="47" stroke="#F8FAFC" stroke-width="0.5" opacity="0.7"/>

    <!-- Hallmark Stamp on Front Face -->
    <g transform="translate(30, 36) rotate(-7) scale(0.85)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#0F172A" opacity="0.9" letter-spacing="0.5">999.0</text>
      <text x="0" y="5.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="4.5" font-weight="800" fill="#1E293B" letter-spacing="1">FINE SILVER</text>
    </g>

    <!-- Chemical Hallmark Circle Stamp on Top Face -->
    <ellipse cx="32" cy="26" rx="4" ry="1.8" fill="none" stroke="#475569" stroke-width="0.4" opacity="0.7"/>
    <text x="32" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" fill="#334155" opacity="0.9">Ag</text>
  </g>

  <!-- Top Ingot Corner Sparkle/Flare -->
  <path d="M 21 31 L 21 28 L 22 31 L 25 31 L 22 32 L 23 35 L 21 33 L 19 35 L 20 32 L 17 31 L 20 31 Z" fill="url(#silverGlint)"/>
  <circle cx="21" cy="31" r="2.5" fill="url(#silverGlint)"/>

  <!-- Subtle bottom label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="900" fill="#E2E8F0" letter-spacing="1.5">SILVER</text>
</svg>
