<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="gasBgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#082138"/>
      <stop offset="65%" stop-color="#041220"/>
      <stop offset="100%" stop-color="#01060C"/>
    </radialGradient>
    <!-- Outer Rim Gradient -->
    <linearGradient id="gasRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <!-- Outer Electric Flame Gradient -->
    <linearGradient id="outerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <!-- Mid Flame Gradient -->
    <linearGradient id="midFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <!-- Core White-Hot Flame Gradient -->
    <linearGradient id="coreFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <!-- Plasma Glow Filter -->
    <filter id="gasGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#gasBgGrad)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#gasRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="0.75"/>

  <!-- Energy Wave Ring Base -->
  <ellipse cx="32" cy="46" rx="14" ry="3.5" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.6"/>
  <ellipse cx="32" cy="46" rx="9" ry="2.2" fill="#0369A1" opacity="0.4"/>

  <!-- Methane Flame Group -->
  <g filter="url(#gasGlow)">
    <!-- Outer Aerodynamic Flame -->
    <path d="M 32 12 C 37 20 45 25 45 34 C 45 42 39 47 32 47 C 25 47 19 42 19 34 C 19 25 27 20 32 12 Z" fill="url(#outerFlame)"/>
    
    <!-- Secondary Dynamic Lobe Curve -->
    <path d="M 32 16 C 35 22 42 27 41 35 C 40 40 37 43 32 45 C 29 43 24 38 25 32 C 26 27 29 23 32 16 Z" fill="url(#midFlame)"/>

    <!-- Inner Core Pure White Flame -->
    <path d="M 32 23 C 34 27 37 31 36 37 C 35 41 33 43 32 43 C 31 43 29 41 28 37 C 27 31 30 27 32 23 Z" fill="url(#coreFlame)"/>

    <!-- Core Center Specular Droplet -->
    <ellipse cx="32" cy="37" rx="2" ry="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="900" fill="#7DD3FC" letter-spacing="1.5">NATGAS</text>
</svg>
