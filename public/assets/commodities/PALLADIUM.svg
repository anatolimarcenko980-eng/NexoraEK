<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Gunmetal -->
    <radialGradient id="palBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1B2228"/>
      <stop offset="65%" stop-color="#0E1216"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <!-- Outer Rim Gradient -->
    <linearGradient id="palRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="30%" stop-color="#B0BEC5"/>
      <stop offset="60%" stop-color="#78909C"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <!-- Ingot Top Facet -->
    <linearGradient id="palTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#ECEFF1"/>
      <stop offset="75%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <!-- Ingot Front Facet -->
    <linearGradient id="palFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="35%" stop-color="#78909C"/>
      <stop offset="75%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <!-- Ingot Right Facet -->
    <linearGradient id="palRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="50%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#1E272C"/>
    </linearGradient>
    <!-- Specular Glint -->
    <radialGradient id="palGlint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ECEFF1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#90A4AE" stop-opacity="0"/>
    </radialGradient>
    <filter id="palShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#palBg)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#palRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#90A4AE" stroke-opacity="0.25" stroke-width="0.75"/>

  <!-- Ingot 3D Group with Shadow -->
  <g filter="url(#palShadow)">
    <!-- Top Face -->
    <polygon points="17,25 43,21 47,26 21,31" fill="url(#palTop)"/>
    <!-- Front Face -->
    <polygon points="21,31 47,26 43,43 17,47" fill="url(#palFront)"/>
    <!-- Right Face -->
    <polygon points="47,26 51,28 47,45 43,43" fill="url(#palRight)"/>
    <!-- Highlights & Bevel Ridges -->
    <polyline points="17,25 21,31 47,26" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
    <line x1="21" y1="31" x2="17" y2="47" stroke="#ECEFF1" stroke-width="0.5" opacity="0.7"/>

    <!-- Hallmark Stamp on Front Face -->
    <g transform="translate(30, 36) rotate(-7) scale(0.85)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#101820" opacity="0.9" letter-spacing="0.5">Pd 999.5</text>
      <text x="0" y="5.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="4" font-weight="800" fill="#263238" letter-spacing="1">PALLADIUM</text>
    </g>

    <!-- Chemical Hallmark Circle Stamp on Top Face -->
    <ellipse cx="32" cy="26" rx="4" ry="1.8" fill="none" stroke="#546E7A" stroke-width="0.4" opacity="0.7"/>
    <text x="32" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" fill="#263238" opacity="0.9">Pd 46</text>
  </g>

  <!-- Top Ingot Corner Sparkle/Flare -->
  <path d="M 21 31 L 21 27 L 22 31 L 26 31 L 22 32 L 24 36 L 21 33 L 18 36 L 20 32 L 16 31 L 20 31 Z" fill="url(#palGlint)"/>
  <circle cx="21" cy="31" r="2.8" fill="url(#palGlint)"/>

  <!-- Subtle bottom label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="900" fill="#CFD8DC" letter-spacing="1.2">PALLADIUM</text>
</svg>
