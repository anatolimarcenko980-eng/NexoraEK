<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="oilBgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#241407"/>
      <stop offset="65%" stop-color="#140902"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>
    <!-- Outer Rim Gradient -->
    <linearGradient id="oilRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <!-- Barrel Body Gradient -->
    <linearGradient id="barrelMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1F26"/>
      <stop offset="25%" stop-color="#4B5563"/>
      <stop offset="45%" stop-color="#374151"/>
      <stop offset="75%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Barrel Top Lid Gradient -->
    <linearGradient id="barrelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <!-- Oil Droplet Gloss Gradient -->
    <linearGradient id="oilDrop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="40%" stop-color="#C2410C"/>
      <stop offset="85%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="oilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#oilBgGrad)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#oilRim)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#F97316" stroke-opacity="0.25" stroke-width="0.75"/>

  <!-- 3D Industrial Oil Barrel -->
  <g filter="url(#oilShadow)">
    <!-- Barrel Cylinder Body -->
    <path d="M 20 22 C 20 22 20 44 20 45 C 20 47.5 25.4 49 32 49 C 38.6 49 44 47.5 44 45 C 44 44 44 22 44 22 Z" fill="url(#barrelMetal)"/>
    
    <!-- Barrel Top Chime Rim -->
    <ellipse cx="32" cy="22" rx="12" ry="4" fill="url(#barrelTop)" stroke="#9CA3AF" stroke-width="0.5"/>
    <ellipse cx="32" cy="22" rx="10.8" ry="3.3" fill="#1F2937" stroke="#4B5563" stroke-width="0.4"/>
    <!-- Bung Hole Cap -->
    <circle cx="26" cy="22" r="1.5" fill="#9CA3AF" stroke="#374151" stroke-width="0.4"/>
    <circle cx="38" cy="21.5" r="1" fill="#6B7280"/>

    <!-- Reinforcing Hoop Ribs -->
    <!-- Top Rib -->
    <path d="M 20 29.5 C 20 31.5 25.4 33 32 33 C 38.6 33 44 31.5 44 29.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" opacity="0.8"/>
    <path d="M 20 30 C 20 32 25.4 33.5 32 33.5 C 38.6 33.5 44 32 44 30" fill="none" stroke="#111827" stroke-width="0.8"/>

    <!-- Bottom Rib -->
    <path d="M 20 38.5 C 20 40.5 25.4 42 32 42 C 38.6 42 44 40.5 44 38.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" opacity="0.8"/>
    <path d="M 20 39 C 20 41 25.4 42.5 32 42.5 C 38.6 42.5 44 41 44 39" fill="none" stroke="#111827" stroke-width="0.8"/>

    <!-- Flame / Crude Oil Droplet Insignia in Center -->
    <g transform="translate(32, 36) scale(0.65)">
      <!-- Droplet Shape -->
      <path d="M 0 -10 C 2.5 -5 6 0 6 5 C 6 8.3 3.3 11 0 11 C -3.3 11 -6 8.3 -6 5 C -6 0 -2.5 -5 0 -10 Z" fill="url(#oilDrop)"/>
      <!-- Inner Specular Light on Drop -->
      <ellipse cx="-1.8" cy="4" rx="1.4" ry="2.8" transform="rotate(-25 -1.8 4)" fill="#FED7AA" opacity="0.8"/>
    </g>

    <!-- Stencil Text -->
    <text x="32" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3" font-weight="900" fill="#F97316" letter-spacing="1.5">CRUDE</text>
  </g>

  <!-- Bottom Label -->
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="900" fill="#FB923C" letter-spacing="1.5">OIL</text>
</svg>
