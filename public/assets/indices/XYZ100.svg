<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="xyz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="xyz-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <filter id="xyz-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00D2FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#xyz-bg)" stroke="#00D2FF" stroke-width="1.5" filter="url(#xyz-shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#00D2FF" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Orbit constellation track -->
  <circle cx="32" cy="27" r="13" stroke="#00D2FF" stroke-width="1.2" stroke-dasharray="3 2" fill="none" opacity="0.6"/>

  <!-- Tri-nodes (BTC Gold, ETH Indigo, SOL Mint) -->
  <circle cx="32" cy="14" r="4" fill="#F7931A"/>
  <circle cx="20" cy="34" r="4" fill="#627EEA"/>
  <circle cx="44" cy="34" r="4" fill="#14F195"/>

  <!-- Tri-connector network lines -->
  <line x1="32" y1="14" x2="20" y2="34" stroke="#00D2FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="14" x2="44" y2="34" stroke="#00D2FF" stroke-width="1.5" opacity="0.7"/>
  <line x1="20" y1="34" x2="44" y2="34" stroke="#00D2FF" stroke-width="1.5" opacity="0.7"/>

  <!-- Center pulse -->
  <circle cx="32" cy="27" r="2.5" fill="#FFFFFF"/>

  <!-- Index typography -->
  <text x="32" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="6.5" fill="#00D2FF" letter-spacing="1">CRYPTO</text>
  <text x="32" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" letter-spacing="1">TOP 100</text>
</svg>
