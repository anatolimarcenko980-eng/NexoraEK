<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ftse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A38"/>
      <stop offset="100%" stop-color="#040C1A"/>
    </linearGradient>
    <linearGradient id="ftse-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0103A"/>
      <stop offset="100%" stop-color="#9E0B28"/>
    </linearGradient>
    <filter id="ftse-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#ftse-bg)" stroke="#C8102E" stroke-width="1.5" filter="url(#ftse-shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Iconic curved horizon arcs -->
  <path d="M16 23 C24 16, 40 16, 48 23" stroke="url(#ftse-red)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M20 27 C26 21, 38 21, 44 27" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- FTSE official typography -->
  <text x="32" y="39" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1.5">FTSE</text>

  <!-- 100 indicator -->
  <text x="32" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#E0103A" letter-spacing="2">100</text>
</svg>
