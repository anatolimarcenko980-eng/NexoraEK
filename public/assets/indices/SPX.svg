<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="spx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31B23"/>
      <stop offset="100%" stop-color="#B30E14"/>
    </linearGradient>
    <linearGradient id="spx-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="spx-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer circular frame with premium edge -->
  <circle cx="32" cy="32" r="30" fill="url(#spx-bg)" stroke="#FF4D52" stroke-width="1.5" filter="url(#spx-shadow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.35"/>
  <ellipse cx="32" cy="18" rx="20" ry="10" fill="url(#spx-sheen)"/>

  <!-- S&P 500 Hallmark Logo Marks -->
  <g transform="translate(0, 0)">
    <!-- Stylized S&P typography -->
    <text x="32" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" letter-spacing="-0.5">S&amp;P</text>
    
    <!-- Red/White divider with upward index arrow -->
    <line x1="16" y1="36" x2="48" y2="36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <polygon points="46,36 41,33 41,39" fill="#FFFFFF"/>

    <!-- 500 bold submark -->
    <text x="32" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="12.5" fill="#FFE5E5" letter-spacing="1">500</text>
  </g>
</svg>
