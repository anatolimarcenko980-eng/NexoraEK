<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rut-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="100%" stop-color="#030D17"/>
    </linearGradient>
    <linearGradient id="rut-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A"/>
      <stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <filter id="rut-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#rut-bg)" stroke="#00B050" stroke-width="1.5" filter="url(#rut-shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#00B050" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- FTSE Russell Signature Compass Arcs -->
  <path d="M18 30 A14 14 0 0 1 46 30" stroke="url(#rut-green)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M32 16 A14 14 0 0 1 46 30" stroke="#00A3E0" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Prominent "R" monogram -->
  <text x="32" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">R</text>

  <!-- Russell & 2000 submarks -->
  <text x="32" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="6.5" fill="#00D26A" letter-spacing="1">RUSSELL</text>
  <text x="32" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" letter-spacing="1">2000</text>
</svg>
