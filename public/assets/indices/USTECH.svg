<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ndx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="100%" stop-color="#052857"/>
    </linearGradient>
    <linearGradient id="ndx-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="50%" stop-color="#00C4FF"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="ndx-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A5E7FF"/>
    </linearGradient>
    <filter id="ndx-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#ndx-bg)" stroke="#00A3E0" stroke-width="1.5" filter="url(#ndx-shadow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#00A3E0" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Nasdaq official dynamic ribbon segments -->
  <g transform="translate(0, -1)">
    <!-- Back darker band -->
    <path d="M18 20 L26 12 L34 12 L22 28 Z" fill="#005B94"/>
    <!-- Main glowing cyan ribbon -->
    <path d="M22 28 L30 16 L38 16 L30 32 Z" fill="url(#ndx-ribbon)"/>
    <!-- Fore highlight band -->
    <path d="M30 32 L38 20 L46 20 L38 36 Z" fill="#33D1FF"/>
    <!-- Precision connecting facet -->
    <polygon points="26,12 34,12 38,20 30,20" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Nasdaq 100 text branding -->
  <text x="32" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="7" fill="#00C4FF" letter-spacing="1.5">NASDAQ</text>
  <text x="32" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" letter-spacing="0.5">100</text>
</svg>
