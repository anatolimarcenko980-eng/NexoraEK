<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hsi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05331C"/>
      <stop offset="100%" stop-color="#01140A"/>
    </linearGradient>
    <linearGradient id="hsi-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="hsi-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#hsi-bg)" stroke="#10B981" stroke-width="1.5" filter="url(#hsi-shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Hang Seng classic hexagonal diamond seal -->
  <polygon points="32,14 44,22 44,34 32,42 20,34 20,22" fill="url(#hsi-red)" stroke="#D4AF37" stroke-width="1"/>
  <circle cx="32" cy="28" r="6" fill="#FFFFFF"/>
  <circle cx="32" cy="28" r="3.5" fill="#B91C1C"/>

  <!-- HSI typography -->
  <text x="32" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" letter-spacing="1">HSI 50</text>
</svg>
