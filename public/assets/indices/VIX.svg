<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C24"/>
      <stop offset="100%" stop-color="#07030F"/>
    </linearGradient>
    <linearGradient id="vix-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <filter id="vix-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF7700" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#vix-bg)" stroke="#FF7700" stroke-width="1.5" filter="url(#vix-shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FF7700" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Volatility seismic waveform pulse -->
  <path d="M12 30 L20 30 L24 16 L28 42 L34 22 L38 34 L42 28 L46 30 L52 30" stroke="url(#vix-orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Subtle waveform glow copy behind -->
  <path d="M12 30 L20 30 L24 16 L28 42 L34 22 L38 34 L42 28 L46 30 L52 30" stroke="#FF7700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25"/>

  <!-- Cboe header label -->
  <text x="32" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="6.5" fill="#A78BFA" letter-spacing="1.5">CBOE</text>

  <!-- VIX bold mark -->
  <text x="32" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="2">VIX</text>
</svg>
