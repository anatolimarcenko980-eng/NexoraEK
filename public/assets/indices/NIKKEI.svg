<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="ni-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E60033"/>
      <stop offset="100%" stop-color="#A30024"/>
    </linearGradient>
    <filter id="ni-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#ni-bg)" stroke="#BC002D" stroke-width="1.5" filter="url(#ni-shadow)"/>
  
  <!-- Outer subtle circular border -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Iconic Japanese Crimson Sun Disc -->
  <circle cx="32" cy="24" r="14" fill="url(#ni-crimson)"/>

  <!-- Stylized Mt. Fuji snow silhouette inside sun -->
  <path d="M22 34 L28 22 L32 26 L36 22 L42 34 Z" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="32,17 34,22 30,22" fill="#FFFFFF"/>

  <!-- Authentic Nikkei Typography -->
  <text x="32" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" letter-spacing="1">NIKKEI</text>
  <text x="32" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#E60033" letter-spacing="0.5">225</text>
</svg>
