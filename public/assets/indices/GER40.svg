<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dax-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="100%" stop-color="#082A5E"/>
    </linearGradient>
    <linearGradient id="dax-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="dax-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#dax-bg)" stroke="#FFCC00" stroke-width="1.5" filter="url(#dax-shadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFCC00" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Deutsche Börse DAX iconic chevron arrow -->
  <g transform="translate(0, -2)">
    <!-- Primary Golden Upward Wedge -->
    <polygon points="18,16 34,16 46,30 34,44 18,44 30,30" fill="url(#dax-gold)"/>
    <!-- Cyan Intersecting Arrow -->
    <polygon points="30,20 38,30 30,40 26,30" fill="#00A3E0"/>
    <polygon points="30,20 34,25 30,30" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- DAX 40 branding -->
  <text x="32" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" letter-spacing="1">DAX</text>
  <text x="47" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="6.5" fill="#FFCC00">40</text>
</svg>
