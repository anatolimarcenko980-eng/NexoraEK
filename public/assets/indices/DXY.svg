<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dxy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3822"/>
      <stop offset="100%" stop-color="#041A0E"/>
    </linearGradient>
    <linearGradient id="dxy-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="dxy-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#dxy-bg)" stroke="#10B981" stroke-width="1.5" filter="url(#dxy-shadow)"/>
  
  <!-- Guilloche security rosette rings -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#34D399" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- Federal Reserve Stars -->
  <g fill="#D4AF37" transform="scale(0.8) translate(8, 6)">
    <polygon points="18,18 19,20 21,20 19.5,21.5 20,23.5 18,22 16,23.5 16.5,21.5 15,20 17,20"/>
    <polygon points="46,18 47,20 49,20 47.5,21.5 48,23.5 46,22 44,23.5 44.5,21.5 43,20 45,20"/>
  </g>

  <!-- Big Bold Dollar Symbol with Dual Bars -->
  <text x="32" y="38" text-anchor="middle" font-family="'Times New Roman', Times, 'Georgia', serif" font-weight="900" font-size="28" fill="url(#dxy-green)">$</text>

  <!-- DXY Index Sub-label -->
  <text x="32" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" letter-spacing="2">DXY</text>
</svg>
